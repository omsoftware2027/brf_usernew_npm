# Template NodeJS + Angular build & deploy

image: node:16.14.0

pipelines:
  default:
    - step:
        name: Build & Deploy Angular App
        size: 2x
        caches:
          - node
        script:
          # Debug: list repo files
          - echo ">>> Listing repo files"
          - ls -la
          
          # Install dependencies
          - npm install
          
          # Install Angular CLI (specific version)
          - npm install -g @angular/cli@~16.2.0
          - ng config -g cli.warnings.versionMismatch false
          
          # Build production
          - ng build --configuration production
          
          # Debug: check build output
          - echo ">>> Build output inside dist/brfoodmain"
          - ls -la dist/brfoodmain/
          
          # Clean remote directory (remove old hashed files)
          - ssh brfserver@72.167.45.111 "rm -rf /var/www/site/brfoodmain/*"
          
          # Deploy only the correct Angular build folder
          - scp -r dist/brfoodmain/* brfserver@72.167.45.111:/var/www/site/brfoodmain/
