image: node:16.14.0

pipelines:
  default:
    - step:
        name: Build & Deploy Angular Staging
        size: 2x
        caches:
          - node
        script:
          # Debug
          - echo ">>> Repo files"
          - ls -la

          # Install dependencies
          - npm install
          - npm install -g @angular/cli@~16.2.0
          - ng config -g cli.warnings.versionMismatch false

          # Build production
          - ng build --configuration production

          # Debug: show build output
          - echo ">>> Build output in dist/brfoodmain/"
          - ls -la dist/brfoodmain/

          # Clean old files
          - ssh -p 33221 ubuntu@103.27.234.244 "rm -rf /var/www/brfoodnew/*"

          # Deploy only the correct Angular build
          - scp -P 33221 -r dist/brfoodmain/* ubuntu@103.27.234.244:/var/www/brfoodnew/
