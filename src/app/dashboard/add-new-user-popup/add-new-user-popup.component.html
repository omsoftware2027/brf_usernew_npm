<div class="row">
    <div class="col-xl-12 mx-auto">
        <div class="team-member-form content-wrapper">
            <div class="">
                <div class="">
                    <div class="d-flex" style="background-color: #F44C4C;height:60px;">
                        <div class="col-md-12 d-flex">
                          <div class="col-md-6">
                              <h5 class="mb-0 main-text text-white m-3">Add New User </h5>
                          </div>
                         <div class="col-md-6 " style="text-align: end;">
                          <button class="close-icon btnn p-0" (click)="closeDialog()"> <i class="bx bx-x"></i></button>
  
                         </div>
                        </div>
  
                      </div>
                
             <div class="col-xl-12 p-5 pm-2">
                <form class="row g-3" [formGroup]="SignUpForm"  method="post" novalidate>
                  
                    <!-- <div class="col-md-6">
                      <div class="form-group">
                          <label for="" class="form-label">Country</label>
                          <div class="input-group">
                              <input type="text" formControlName="typeName" placeholder="Country" class="form-control">
                          </div>
                      </div>
                  </div> -->
                  <div class="col-md-6 ">
                    <div class="form-group">
                        <label for="" class="form-label">First Name</label>
                        <div class="input-group">
                            <input type="text" formControlName="firstName" (keypress)="keyPressAlphabets($event)" placeholder="first name" class="form-control">
                        </div>
                        <mat-error>
                            <span *ngIf="(submitted && SignUpForm.get('firstName')?.errors) || !SignUpForm.get('firstName')?.valid && SignUpForm.get('firstName')?.touched">Please enter first name  </span>
                        </mat-error>
                    </div>
                </div>

                <!-- <div class="col-md-6">
                  <div class="form-group">
                      <label for="" class="form-label">District</label>
                      <div class="input-group">
                          <input type="text" formControlName="district" placeholder="District" class="form-control">
                      </div>
                  </div>
              </div>-->
              <div class="col-md-6">
                <div class="form-group">
                    <label for="" class="form-label">Last Name</label>
                    <div class="input-group">
                        <input type="text" formControlName="lastName" (keypress)="keyPressAlphabets($event)" placeholder="Last name" class="form-control">
                    </div>
                    <mat-error>
                        <span *ngIf="(submitted && SignUpForm.get('lastName')?.errors) || !SignUpForm.get('lastName')?.valid && SignUpForm.get('lastName')?.touched">Please enter last name  </span>
                    </mat-error>
                </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                  <label for="" class="form-label">Email Address</label>
                  <div class="input-group">
                      <input type="text" formControlName="email" placeholder="email" class="form-control">
                  </div>
                  <mat-error>
                    <span *ngIf="(submitted && SignUpForm.get('email')?.errors) || !SignUpForm.get('email')?.valid && SignUpForm.get('email')?.touched">Please enter email </span>
                </mat-error>
              </div>
          </div> 
          
        
          <div class="col-md-6">
              <div class="form-group">
                  <label for="" class="form-label">Phone Number</label>
                  <div class="input-group">
                      <input type="text" formControlName="mobile" placeholder="phone number" class="form-control" maxlength="10" (keypress)="keyPressNumbers($event)">
                  </div>
                  <mat-error>
                    <span *ngIf="(submitted && SignUpForm.get('mobile')?.errors) || !SignUpForm.get('mobile')?.valid && SignUpForm.get('mobile')?.touched">Please enter mobile number </span>
                </mat-error>
              </div>
          </div>
         
            <!-- <div class="col-md-6">
              <div class="form-group">
                  <label for="" class="form-label">Sub-Area</label>
                  <div class="input-group">
                      <input type="text" formControlName="officeName" placeholder="Sub-Area" class="form-control">
                  </div>
              </div>
          </div> -->
                  <div class="d-flex mt-3">
                    <div class="col-6  mt-3" style="text-align: center;">
                        <button type="submit" class="btn btn-secondary px-5 text-white" (click)="submit()"  >Add User</button>
                    </div>
                    <div class="col-6  mt-3" style="text-align: center;"> 
                        <button type="submit" class="btn btn-primary  px-5 text-white" (click)="closeDialog()"  >Cancel</button>
                    </div>
                  </div>
                </form>
             </div>
                </div>
            </div>
        </div>
    </div>
  </div>
