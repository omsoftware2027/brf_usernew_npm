<div class="page-breadcrumb d-none d-md-flex align-items-center mb-3" style="margin-top:144px;height: 72px;background-color: 
#F2F4F5;">
    
    <div class="ps-4 container">
        <nav aria-label="breadcrumb" >
            <ol class="breadcrumb mb-0 p-0 mt-3" >
                <li style="cursor:pointer;" class="breadcrumb-item">
                    <a 
                        href="#/analytics" routerLink="/analytics" >
                        <i class='bx bx-home-alt' style="color:#5F6C72"></i>
                    </a>
                </li>
                <li style="cursor:pointer;" class="breadcrumb-item active" style="color:#4C7C17;font-size: 14px;font-weight: 500
                ;line-height: 20px;" aria-current="page">Location
</li>
              
            </ol>
        </nav>
    </div>
  </div>
<div class="container">
    <div class="col-md-12 card mt-4" style="border-radius: 9px;">
        <h6 class="p-3" style="font-weight: 500;font-size: 20px;line-height: 24px;color:#000">My Order List </h6>
        <div *ngFor="let orderdata of reorder">
            <div style="background-color: #F44C4C; height: 35px;" >
                <div class="col-md-12 d-flex mt-2 container">
                    <div class="col-md-2 text-white">
                        <p>{{orderdata.shippingDate | date:'short'}}</p>
                    </div>
                    <div class="col-md-3"></div>
                    <div class="col-md-1"><button class="btn1 text-white mt-1" style="background-color: #34BBD9;letter-spacing: 0.5px">PRINT</button></div>
                    <div class="col-md-3"><button class="btn2 text-white mt-1"  style="background-color: #3A51A2;"[routerLink]="['/manage-cartt',orderdata.orderId]">REORDER</button></div>
                    <div class="col-md-2">   <button class="btn3 text-white mt-1 " style="background-color: #832727 ;margin-left: -20px;letter-spacing: 0.5px">{{orderdata.transactionId}}</button></div>
                    
                </div>
              
                
                
             
                </div>
                <table class="table">
                    <thead>
                      <tr>
                        <th scope="col" style=" color:#475156 !important">PRODUCTS</th>
                     
                        <th scope="col"style=" color:#475156 !important" >ACTIONS</th>
                      </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let data of orderdata.productProjections">
                            <th scope="row">
                                <div  class="d-flex align-items-center">
                                    <div class="flex-shrink-0 me-2">
                                        <div>
                                            <img class="avatar-xs  customer-image-elem" alt=""
                                                [src]="data.productImage || 'assets/images/download (20).png' " style="width:62px;height:62px">
                                        </div>
                                    </div>
                                    <div class="flex-grow-1 p-3">
                                        <p class="fs-base mb-0"><a href="javascript:void(0);"
                                                class="text-reset customer-name-elem" style="color:#032088 !important;font-weight: 500;font-size:14px;line-height: 15px;"[routerLink]="['/product', data?.productId, dashboardservice.generateSlug(data?.title)]">{{data?.title}}</a></p>
                                      <div class="d-flex">
                                        <div ><p style="color:#F44C4C">Price:<span style="color:#475156">{{data.price}}</span></p></div>
                                        <div  style="margin-left: 38px"><p style="color:#F44C4C">Quantity:<span style="color:#475156">{{data.quantity}}</span></p></div>
                                        <div  style="margin-left: 38px"><p style="color:#F44C4C">Total:<span style="color:#475156">{{data.totalPrice}}$</span></p></div>
                                      </div>
                                                


                                    </div>
                                </div>
            
                            </th>
                           
                            <td>   <button type="button btn-secondary " class="btn mt-3" [routerLink]="['/product', data?.productId, dashboardservice.generateSlug(data?.title)]" style="background-color: #F44C4C; color: white;width:80px;height: 33px;
                                ">VIEW
                                  </button></td>
                          </tr>
            
                    
                    </tbody>
                  </table>
                  <div style="background-color: #F2F4F5; height: 35px;" class="mt-2 mb-3">
                    <div class="col-md-12 d-flex mt-2 container">
                        <div class="col-md-6 text-white">
                            <p class="text-black">Delivery Date & Time :{{orderdata.transactionDate | date:'short'}} </p>
                        </div>
                        <div class="col-md-4"></div>
                     
                        
                    </div>
                  
                    
                    
                 
                    </div>
        </div>

           
    </div>
</div>
