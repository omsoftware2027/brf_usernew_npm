<div>
    <div class="text-center">
        <div class="mt-2 fs-base">
            <h4 class="mb-1">Update Weight</h4>
            <hr>
    <div class="d-flex align-items-center gap-2">
     <div class="flex-grow-1">
     <a >
       <h6 class="fs-md mb-2">{{ productNameModal }}</h6>
    </a>
  </div>
  <div class="text-end">
  <h5 class="fs-md text-primary mb-0">({{totalPriceModal}})</h5>
  </div>


</div>
<div class="col-md-12">
<div class="col-md-8" *ngFor="let _ of generateArray(quantity); let i = index">
<input type="text" id="Property-title-input" class="form-control m-1" placeholder="Enter weight"
     [(ngModel)]="inputValues[i]" (keyup)="checkInventory(inputValues[i], i)">
<span *ngIf="!checkInventoryStatus[i]" class="text-danger">
Weight is not matching with the inventory in hand - Do you still want to proceed?
</span>
</div>
<button type="submit" class="btn btn-success" id="add-btn" (click)="sumbitInventory()">Save</button>
</div>









<hr>
<h4 class="mb-1">Available Inventory</h4>
<table class="table align-middle table-nowrap" style="width: 100%;">
<thead class="table-active">
  <tr>
      <th>Sr No</th>
      <th>Inventory Code</th>
      <th>Weight</th>
      <th>Available</th>

  </tr>
</thead>
<tbody>
  <tr *ngFor="let data of inventorylist; let i = index;">
       <td>{{ i + 1 }}</td>
      <td>{{data.inventoryCode}}</td>
      <td>{{data.weight}}</td>
      <td>
        <input class="form-check-input" type="checkbox" (change)="updateInputValue(i, data)" [checked]="data.isSold === true" >
      </td>
  </tr>
</tbody>
</table>
        </div>
    </div>
</div>
