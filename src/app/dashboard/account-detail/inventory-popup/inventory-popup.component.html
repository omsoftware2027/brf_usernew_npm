<div class="d-flex" style="background-color: #F44C4C;height:60px;">
  <div class="col-md-12 d-flex">
    <div class="col-md-6">
        <h5 class="mb-0 main-text text-white m-3">Update Weight</h5>
    </div>
   <div class="col-md-6 " style="text-align: end;">
    <button class="close-icon btnn btn-close  p-0" (click)="closeDialog()"> <i class="bx bx-x"></i></button>

   </div>
  </div>


</div>
<div class="p-3">
  
    <div class="text-center p-3" style="overflow:auto;">
  
        <div class="mt-2 fs-base" style="max-height: 276px;">
            <!-- <h4 class="mb-1" style="color: #F44C4C;">Update Weight</h4>
            <hr> -->
    <div class="d-flex align-items-center gap-2">
     <div class="flex-grow-1">
     <a >
       <h6 class="fs-md mb-2">{{ productNameModal }}</h6>
    </a>
  </div>
  <div class="text-end">
  <h5 class="fs-md  mb-0" style="color: #F44C4C;">({{totalPriceModal}})</h5>
  </div>


</div>
<div class="col-md-12">
<div class="col-md-8" *ngFor="let _ of generateArray(quantity); let i = index">
<input type="text" id="Property-title-input" class="form-control m-1" placeholder="Enter weight"
     [(ngModel)]="inputValues[i]" (keyup)="checkInventory(inputValues[i], i)">
<span *ngIf="!checkInventoryStatus[i]" class="text-danger">
Weight is not matching with the inventory in hand - Do you still want to proceed?
</span>
</div>
<button type="submit" class="btn " id="add-btn" (click)="sumbitInventory()" style="background-color: #F44C4C;color:white;">Save</button>
</div>









<hr>
<h4 class="mb-1"style="color: #F44C4C;">Available Inventory</h4>
<table class="table align-middle table-nowrap" style="width: 100%;">
<thead class="table-active">
  <tr>
      <th>Sr No</th>
      <th>Inventory Code</th>
      <th>Weight</th>
      <th>Available</th>

  </tr>
</thead>
<tbody>
  <tr *ngFor="let data of inventorylist; let i = index;">
       <td>{{ i + 1 }}</td>
      <td>{{data.inventoryCode}}</td>
      <td>{{data.weight}}</td>
      <td>
        <input class="form-check-input" type="checkbox" (change)="updateInputValue(i, data)" [checked]="data.isSold === true" >
      </td>
  </tr>
</tbody>
</table>
        </div>
    </div>
</div>
