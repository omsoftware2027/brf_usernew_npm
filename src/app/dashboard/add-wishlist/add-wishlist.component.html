<div class="page-breadcrumb d-none d-md-flex align-items-center mb-3" style="margin-top:144px;height: 72px;background-color: 
#F2F4F5;">
    
    <div class="ps-4 container ">
        <nav aria-label="breadcrumb" >
            <ol class="breadcrumb mb-0 p-0 mt-4" >
                <li style="cursor:pointer;" class="breadcrumb-item">
                    <a 
                        href="#/dashboard/analytics" routerLink="/dashboard/analytics" >
                        <i class='bx bx-home-alt' style="color:#5F6C72"></i>
                    </a>
                </li>
                <li style="cursor:pointer;" class="breadcrumb-item active" style="color:#4C7C17;font-size: 14px;font-weight: 500
                ;line-height: 20px;" aria-current="page">Wishlist</li>
              
            </ol>
        </nav>
    </div>
  </div>
<div class="container" >

 <div class="col-md-12 p-5">
    <div class="col-md-12 card " style="    border-radius: 9px;">
        <div class="card-title d-flex align-items-center">
            <h5 class="mb-0 main-text p-3"  style="font-weight:600;font-size:20px;line-height:24px; color:
            #191C1F;">Wishlist</h5>
        </div>
        <table class="table">
            <thead>
              <tr >
                <th scope="col" style=" color:#475156">Products</th>
                <th scope="col" style=" color:#475156">Price</th>
                <th scope="col" style=" color:#475156">Stock Status</th>
                <th scope="col" style=" color:#475156">Actions</th>
              </tr>
            </thead>
            <tbody>
                <div class="mt-2 cardNA" *ngIf="!wishlist.length">
                    <h5 class="mb-1">Data not Available</h5>
                  </div>
              <tr *ngFor="let data of  wishlist">
                <th scope="row">
                    <div  class="d-flex align-items-center">
                        <div class="flex-shrink-0 me-2">
                            <div>
                                <img class="avatar-xs  customer-image-elem" alt=""
                                [src]="data.image|| 'assets/images/download (20).png'"  style="width:52px;height:52px">
                            </div>
                        </div>
                        <div class="flex-grow-1">
                            <p class="fs-base mb-0"><a href="javascript:void(0);"
                                    class="text-reset customer-name-elem" style="font-weight: 400;font-size: 14px;line-height: 15px;color:#475156">{{data.productTitle}}</a></p>
                        </div>
                    </div>

                </th>
                <td style="font-weight: 500;font-size: 14px;line-height: 20px;color:#475156">${{data.price}}</td>
                <td style="font-weight: 500;font-size: 14px;line-height: 20px;color:#2DB224">{{data.productStatus}}</td>
                <td  class="d-flex">   <button type="button" class="btn btn-primary mt-3" (click)="submitcart(data.productId,data.price)" style="background-color: #F44C4C; color: white; width:160px ;height: 48px;
                    border-radius: 2px;font-weight: 700;
    font-size: 14px;
    line-height: 35px;
                    ">ADD TO CART
                        <img src="../../../assets/images/Add to cart.png" 
                        class="" style="width:24px;height: 24px;"> </button> <p class="p-4"><mat-icon style="color: #929FA5;" (click)="deletewishlist(data.wishlistId)">highlight_off</mat-icon></p></td>
              </tr>
            
            </tbody>
          </table>
    </div>
 </div>
</div>
