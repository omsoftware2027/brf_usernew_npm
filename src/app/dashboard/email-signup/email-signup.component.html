<div class="page-breadcrumb d-md-flex align-items-center mb-3" style="margin-top:192px;height: 72px;background-color: 
#F2F4F5;">
    
    <div class="ps-4 container">
        <nav aria-label="breadcrumb" >
            <ol class="breadcrumb mb-0 p-0 mt-2" >
                <li style="cursor:pointer;" class="breadcrumb-item">
                    <a 
                        href="#/analytics" routerLink="/analytics" >
                        <i class='bx bx-home-alt' style="color:#5F6C72"></i>
                    </a>
                </li>
                <li style="cursor:pointer;" class="breadcrumb-item active" style="color:#4C7C17;font-size: 14px;font-weight: 500
                ;line-height: 20px;" aria-current="page">Email Sign Up 
</li>
              
            </ol>
        </nav>
    </div>
  </div>
  <div class="container">

    <div class="col-md-12 d-flex d-block-mb">
        <div class="col-md-12 col-lg-5 col-xl-5" >
            <div class="card-title d-flex align-items-center">
                <h5 class="mb-0 main-text"  style="font-weight:400;font-size:30px;line-height:28px; color:#F44C4C">Login To Our Site</h5>
            </div>
            <img src="../../../assets/images/line 1.png"  class="" style="width: 100%;height: 2px;"  >
            <form class="g-3"  [formGroup]="formGroup"   *ngIf="login==true" >
             <div class="col-md-12 card" style="border-radius: 9px;">
              <div class="row p-4" > 
                <!-- <h5>User Details</h5> -->
               <div >
                <div class="col-md-12 mt-3 ">
                    <div class="form-group">
                        <label for="" class="form-label">Email</label>
                        <div class="input-group" >
                            <input type="text" placeholder="email" class="form-control" formControlName="email">
                        </div>
      
                        <mat-error>
                            <span *ngIf="(submittedd && formGroup.get('email')?.errors) || !formGroup.get('email')?.valid && formGroup.get('email')?.touched">Please enter email </span>
                        </mat-error>
      
                        
                        
                    </div>
                </div>
                <div class="col-md-12 mt-3">
                
                </div>
                <div class="col-md-12 ">
                    <div class="form-group">
                        <label for="" class="form-label">Password</label>
                        <div class="input-group" >
                            <input type="password"  placeholder="password" class="form-control" formControlName="password">
                        </div>
        
                        <mat-error>
                            <span *ngIf="(submittedd && formGroup.get('password')?.errors) || !formGroup.get('password')?.valid && formGroup.get('password')?.touched">Please enter password </span>
                        </mat-error>
        
                        
                        
                    </div>
                  </div>
                  <div class="col-md-12 mt-3">
                    <span class="text-info" style="margin-left: 6px;cursor: pointer;" (click)="forgotpasssword()">Forgot Password</span>
                  </div>
                  <div class="col-md-12 text-end">
                    <button class="btn btn-secondary text-white" style="background-color:#F44C4C;letter-spacing: 0.5px" (click)="onSubmit()">Sign In</button>
                </div>
               </div>
              </div>
             </div>
          
             
            </form>
            <form class="g-3"  [formGroup]="forgotpasswordform"   *ngIf="login==false" >
                <div class="col-md-12 card" style="border-radius: 9px;">
                 <div class="row p-4" > 
                   <!-- <h5>User Details</h5> -->
                  <div >
                   <div class="col-md-12 mt-3 ">
                       <div class="form-group">
                           <label for="" class="form-label">Email</label>
                           <div class="input-group" >
                               <input type="text" placeholder="email" class="form-control" formControlName="email">
                           </div>
         
                           <mat-error>
                               <span *ngIf="(submittedd && formGroup.get('email')?.errors) || !formGroup.get('email')?.valid && formGroup.get('email')?.touched">Please enter email </span>
                           </mat-error>
         
                           
                           
                       </div>
                   </div>
                   <div class="col-md-12 mt-3">
                   
                   </div>
                 
                     <div class="col-md-12 mt-3">
                       <span class="text-info" style="margin-left: 6px;cursor: pointer;" (click)="signin()">Sign In </span>
                     </div>
                  </div>
                 </div>
                </div>
                <div class="col-md-12 text-end">
                   <button class="btnn btn-secondary text-white" style="background-color:#F44C4C;letter-spacing: 0.5px" (click)="forgotpassword()">Forgot Password</button>
               </div>
                
               </form>
          
           
        
         
          </div>
          <div class="col-md-12 col-lg-1 col-xl-1">

          </div>
          <div class="col-md-12 col-lg-5 col-xl-5" >
            <div class="card-title d-flex align-items-center">
                <h5 class="mb-0 main-text"  style="font-weight:400;font-size:30px;line-height:28px; color:#F44C4C">Sign Up Now</h5>
            </div>
            <img src="../../../assets/images/line 1.png"  class="" style="width: 100%;height: 2px;"  >
            <form class="g-3"  [formGroup]="SignUpForm"    >
             <div class="col-md-12 card" style="border-radius: 9px;">
              <div class="row p-4" > 
                <!-- <h5>User Details</h5> -->
                <div class="col-md-6 mt-3 ">
                    <div class="form-group">
                        <label for="" class="form-label">First Name </label>
                        <div class="input-group" >
                            <input type="text" placeholder="first name " (keypress)="keyPressAlphabets($event)" class="form-control" formControlName="firstName">
                        </div>
      
                        <mat-error>
                            <span *ngIf="(submitted && SignUpForm.get('firstName')?.errors) || !SignUpForm.get('firstName')?.valid && SignUpForm.get('firstName')?.touched">Please enter first name </span>
                        </mat-error>
      
                        
                        
                    </div>
                </div>
                <div class="col-md-6 mt-3">
                    <div class="form-group">
                        <label for="" class="form-label">Last Name</label>
                        <div class="input-group" >
                            <input type="text"  placeholder="last name" (keypress)="keyPressAlphabets($event)" class="form-control" formControlName="lastName">
                        </div>
        
                        <mat-error>
                            <span *ngIf="(submitted && SignUpForm.get('lastName')?.errors) || !SignUpForm.get('lastName')?.valid && SignUpForm.get('lastName')?.touched">Please enter  last name </span>
                        </mat-error> 
        
                        
                        
                    </div>
                </div>
                <div class="col-md-12 mt-2">
                    <div class="form-group">
                        <label for="" class="form-label">Email</label>
                        <div class="input-group" >
                            <input type="text"  placeholder="email" class="form-control" formControlName="email">
                        </div>
        
                        <mat-error>
                            <span *ngIf="(submitted && SignUpForm.get('email')?.errors) || !SignUpForm.get('email')?.valid && SignUpForm.get('email')?.touched">Please enter email</span>
                        </mat-error>
                    </div>
                  </div>
                  <div class="col-md-12 mt-2">
                    <div class="form-group">
                        <label for="" class="form-label">Phone Number</label>
                        <div class="input-group" >
                            <input type="text"  placeholder="phone number" class="form-control" formControlName="mobile" [maxLength]="10" (keypress)="keyPressNumbers($event)">
                        </div>
                        <mat-error>
                            <span *ngIf="(submitted && SignUpForm.get('mobile')?.errors) || !SignUpForm.get('mobile')?.valid && SignUpForm.get('mobile')?.touched">Please Enter mobile number</span>
                        </mat-error>
                    </div>
                  </div>
                  <div class="col-md-12 mt-2">
                    <div class="form-group">
                        <label for="" class="form-label">Password</label>
                        <div class="d-flex position-relative" >
                            <input type="password" [type]="fieldTextType ? 'text' : 'password'"  placeholder="password" class="form-control" formControlName="password">
                                <i class="bx bxs-show align-middle position-absolute end-0 top-0 pe-3 pt-2" *ngIf="!fieldTextType" (click)="toggleFieldTextType()" style="font-size: 18px;"></i>
                                <i class="bx bxs-hide align-middle position-absolute end-0 top-0 pe-3 pt-2" *ngIf="fieldTextType" (click)="toggleFieldTextType()" style="font-size: 18px;"></i>
                        </div>
                        <mat-error>
                            <span *ngIf="(submitted && SignUpForm.get('password')?.errors) || !SignUpForm.get('password')?.valid && SignUpForm.get('password')?.touched">Please enter password </span>
                        </mat-error>
                    </div>
                  </div>
                  <div class="col-md-12 mt-2">
                    <div class="form-group">
                        <label for="" class="form-label">Confirm Password</label>
                        <div class="d-flex position-relative" >
                            <input [type]="fieldTextType1 ? 'text' : 'password'"  placeholder="Confirm password" class="form-control" formControlName="confirmPassword">
                            <i class="bx bxs-show align-middle position-absolute end-0 top-0 pe-3 pt-2" *ngIf="!fieldTextType1" (click)="toggleFieldTextType1()" style="font-size: 18px;"></i>
                            <i class="bx bxs-hide align-middle position-absolute end-0 top-0 pe-3 pt-2" *ngIf="fieldTextType1" (click)="toggleFieldTextType1()" style="font-size: 18px;"></i>
                        </div>
                        <mat-error>
                            <!-- <span *ngIf="(submitted && SignUpForm.get('confirmPassword')?.errors) || !SignUpForm.get('confirmPassword')?.valid && SignUpForm.get('confirmPassword')?.touched">Please enter password </span> -->
                            <span class="text-start" *ngIf="confirmPassword.errors?.notEquivalent && SignUpForm.get('confirmPassword')?.touched">
                                Password does not match
                            </span>
                        </mat-error>
                    </div>
                  </div>
                  <div class="col-md-12 text-end mt-3">
                    <button class="btn btn-secondary text-white" style="background-color:#F44C4C;letter-spacing: 0.5px" (click)="submit()">Sign Up</button>
                </div>
              </div>
             </div>
             
             
            </form>
          
           
        
         
          </div>
    </div>
   

  </div>
